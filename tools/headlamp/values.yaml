# Headlamp Helm Values
# Reference: https://github.com/headlamp-k8s/headlamp/blob/main/charts/headlamp/values.yaml

replicaCount: 1

# Run in-cluster mode (access cluster via service account)
config:
  inCluster: true

# Service configuration (LoadBalancer for direct external access)
service:
  type: LoadBalancer
  port: 80

# Service account for Headlamp to access cluster resources
serviceAccount:
  create: true
  name: headlamp

# Cluster role binding to allow Headlamp to read cluster resources
clusterRoleBinding:
  create: true
  # Using view role by default, admin-user service account has cluster-admin
  clusterRoleName: cluster-admin

# Resource requests/limits tuned for t3a.small nodes (2 vCPU, 2 GB RAM)
# Mirrors hello-world app sizing; leaves headroom for system pods
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
