# INSTRUCTOR reference release+deploy pipeline (APP-09/APP-11 answer key).
# Students author their own; the starter keeps hello.yml (S1) and ci.yml (S3)
# separate and does NOT ship this. On a v* tag: test -> build-push (GHCR) ->
# deploy (SSH the exact release onto the VM). A failure at any stage propagates.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lowercase owner namespace
        id: ns
        run: echo "ns=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: instructor/Dockerfile.reference
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.ns }}/hello-world:${{ github.ref_name }}
            ghcr.io/${{ steps.ns.outputs.ns }}/hello-world:latest
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          HELLO_IMAGE_TAG: ${{ github.ref_name }}
          GHCR_NAMESPACE: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}      # the stable Elastic IP
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}    # the dedicated deploy key (read-only on GHCR)
          envs: HELLO_IMAGE_TAG,GHCR_NAMESPACE,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_NAMESPACE,,}" --password-stdin
            cd ~/hello-world                 # holds the committed registry compose.yml
            docker compose pull              # fails nonzero on a bad pull; never runs an old cached image
            docker compose up -d
            sleep 4
            curl -sf http://localhost:8000/health >/dev/null || { echo "post-deploy health FAILED"; exit 1; }
            echo "RUNNING_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q hello)")"
